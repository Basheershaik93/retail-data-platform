services:
  retail-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${RETAIL_POSTGRES_DB:?Set RETAIL_POSTGRES_DB in .env}
      POSTGRES_USER: ${RETAIL_POSTGRES_USER:?Set RETAIL_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${RETAIL_POSTGRES_PASSWORD:?Set RETAIL_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - retail_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  retail_postgres_data:
